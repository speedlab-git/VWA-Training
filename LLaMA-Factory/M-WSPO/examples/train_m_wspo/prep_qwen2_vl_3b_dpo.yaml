### Prep step: DPO-finetune Qwen2.5-VL-3B-Instruct to produce the
### *aligned weak model* (pi_r^w) for m-WSPO LLaVA-1.5-7B training.
###
### Run this FIRST. The resulting checkpoint becomes the weak-aligned model
### used when generating cache/rlhf_v_mwspo_weak_lp_qwen3b.parquet.

### model
model_name_or_path: Qwen/Qwen2.5-VL-3B-Instruct
image_max_pixels: 262144
trust_remote_code: true

### method
stage: dpo
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
pref_beta: 0.1
pref_loss: sigmoid

### dataset
dataset: rlhf_v
template: qwen2_vl
cutoff_len: 2048
max_samples: 100000
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/qwen2_vl_3b/dpo_rlhfv
overwrite_output_dir: true
plot_loss: true
logging_steps: 10
save_steps: 500
report_to: none

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 5.0e-6
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
ddp_timeout: 180000000
deepspeed: examples/deepspeed/ds_z3_config.json
gradient_checkpointing: true
